<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divyesh Dabgar - NBS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- THEME SETTINGS --- */
        :root {
            --primary-color: #4A148C; 
            --secondary-color: #7c43bd;
            --text-color: #333;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(rgba(74, 20, 140, 0.5), rgba(74, 20, 140, 0.7)), url('image_1.png') no-repeat center center/cover;
            height: 160px;
            position: relative;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            background-color: #fff;
            border-radius: 15px; 
            border: 5px solid #fff;
            object-fit: contain;
            margin-top: -80px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
        }

        .info {
            padding: 10px 20px;
        }

        .school-name {
            font-size: 14px;
            color: #666;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .person-name {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 5px 0;
        }

        .designation {
            font-size: 16px;
            color: #555;
            font-weight: 500;
            background-color: #f3e5f5;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 20, 140, 0.3);
        }

        .details-list {
            list-style: none;
            padding: 0 30px;
            text-align: left;
            margin-bottom: 25px;
        }

        .details-list li {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: var(--text-color);
            display: flex;
            align-items: center;
            font-size: 15px;
        }

        .details-list i {
            color: var(--primary-color);
            width: 30px;
            font-size: 18px;
            margin-right: 10px;
        }

        .details-list a {
            text-decoration: none;
            color: var(--text-color);
        }

        .save-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .save-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header"></div>

        <img src="image_0.png" alt="Logo" class="profile-img">

        <div class="info">
            <p class="school-name">Narayana Business School</p>
            <h1 class="person-name">Divyesh Dabgar</h1>
            <span class="designation">IT Department</span>
        </div>

        <div class="actions">
            <a href="tel:+918401717597" class="action-btn"><i class="fas fa-phone-alt"></i></a>
            <a href="https://wa.me/918401717597" class="action-btn"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:it@nbs.edu.in" class="action-btn"><i class="fas fa-envelope"></i></a>
            <a href="https://maps.app.goo.gl/ipy5hqigREnFPY338" target="_blank" class="action-btn"><i class="fas fa-map-marked-alt"></i></a>
        </div>

        <ul class="details-list">
            <li>
                <i class="fas fa-mobile-alt"></i> 
                <a href="tel:+918401717597">+91 84017 17597</a>
            </li>
            <li>
                <i class="fas fa-envelope-open-text"></i> 
                <a href="mailto:it@nbs.edu.in">it@nbs.edu.in</a>
            </li>
            <li>
                <i class="fas fa-location-dot"></i> 
                <a href="https://maps.app.goo.gl/ipy5hqigREnFPY338" target="_blank">Narayana Business School</a>
            </li>
        </ul>

        <button onclick="downloadVCard()" class="save-btn">
            <i class="fas fa-user-plus"></i> Save Contact
        </button>

    </div>

    <script>
        function downloadVCard() {
            var firstName = "Divyesh";
            var lastName = "Dabgar";
            var org = "Narayana Business School";
            var phone = "+918401717597";
            // Updated Email Variable for vCard
            var email = "it@nbs.edu.in"; 
            
            var saveAsName = "IT Divyesh Dabgar Narayana Business School"; 

            var vCardData = 
                "BEGIN:VCARD\n" +
                "VERSION:3.0\n" +
                "FN:" + saveAsName + "\n" +
                "N:" + lastName + ";" + firstName + ";;;\n" +
                "ORG:" + org + "\n" +
                "TEL;TYPE=CELL:" + phone + "\n" +
                "EMAIL;TYPE=WORK:" + email + "\n" +
                "END:VCARD";

            var blob = new Blob([vCardData], { type: "text/vcard" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "Divyesh_NBS.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
